version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/ratri?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-secret-key-32bytes-long}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://ratri.app,http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongo --quiet) -eq 1
      interval: 10s
      start_period: 30s
    volumes:
      - mongodb_prod_data:/data/db

  redis:
    image: redis:7-alpine
    volumes:
      - redis_prod_data:/data

  coturn:
    image: coturn/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      TURN_SECRET: ${TURN_SECRET:-change-me-turn-secret}
      TURN_REALM: ratri.app
    command: >
      -n --log-file=stdout --min-port=49152 --max-port=65535
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-change-me-turn-secret} --realm=ratri.app

volumes:
  mongodb_prod_data:
  redis_prod_data:
