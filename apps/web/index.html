<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags -->
    <title>RATRI — Real-Time Social Watch & Talk Platform</title>
    <meta name="title" content="RATRI — Real-Time Social Watch & Talk Platform" />
    <meta name="description" content="Watch synchronized videos, listen to music lounges, play games, and chat with friends in real-time over low-latency WebRTC voice & video. Guest-friendly, zero signups." />
    <meta name="keywords" content="watch party, watch together, room chat, youtube sync, spatial voice lounge, webRTC voice, ratri, real-time social" />
    <meta name="author" content="Akash (Akashcodev001)" />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ratri.app/" />
    <meta property="og:title" content="RATRI — Real-Time Social Watch & Talk Platform" />
    <meta property="og:description" content="Watch synchronized videos, listen to music lounges, play games, and chat with friends in real-time over low-latency WebRTC voice & video." />
    <meta property="og:image" content="https://ratri.app/hero_showcase.jpg" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ratri.app/" />
    <meta property="twitter:title" content="RATRI — Real-Time Social Watch & Talk Platform" />
    <meta property="twitter:description" content="Watch synchronized videos, listen to music lounges, play games, and chat with friends in real-time over low-latency WebRTC voice & video." />
    <meta property="twitter:image" content="https://ratri.app/hero_showcase.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <!-- Structured Data (Schema.org WebApplication) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ratri",
        "url": "https://ratri.app",
        "description": "Real-time social watch party & spatial voice lounge platform.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "All",
        "author": {
          "@type": "Person",
          "name": "Akash",
          "url": "https://github.com/akashcodev001"
        }
      }
    </script>
  </head>
  <body class="bg-bg text-text selection:bg-accent selection:text-accent-foreground font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
