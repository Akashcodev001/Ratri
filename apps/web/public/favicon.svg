<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Red Box -->
  <rect width="100" height="100" rx="24" fill="url(#redGrad)" />
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- TV Icon in White -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Antennas -->
    <path d="M 36 22 L 47 34 L 43 37 L 32 25 Z" />
    <path d="M 64 22 L 53 34 L 57 37 L 68 25 Z" />

    <!-- TV Body -->
    <rect x="18" y="32" width="64" height="46" rx="8" />

    <!-- TV Screen Cutout -->
    <rect x="25" y="38" width="50" height="34" rx="4" fill="url(#redGrad)" opacity="0.3" />
    
    <!-- Screen Play Icon -->
    <path d="M 44 47 L 60 55 L 44 63 Z" fill="#FFFFFF" />
  </g>
</svg>