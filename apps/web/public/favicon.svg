<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <!-- RATRI Brand Icon: Crescent Moon + Play Symbol -->
  <g filter="url(#shadow)">
    <!-- Crescent Moon (representing RATRI / Night) -->
    <path d="M48 22 C 32 22, 19 35, 19 51 C 19 67, 32 80, 48 80 C 59 80, 68 74, 73 65 C 62 67, 51 59, 51 47 C 51 36, 59 27, 70 24 C 63 22, 55 22, 48 22 Z" fill="url(#whiteGrad)" />
    
    <!-- Neon Play Pulse Triangle (representing Watch Party / Live Media) -->
    <path d="M52 36 L 77 51 L 52 66 Z" fill="url(#accentGrad)" />
  </g>
</svg>